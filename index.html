<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/pomi-logo.svg" />
    <meta name="theme-color" content="#202020" />
    <meta name="description" content="POMI — Planejador Ominira" />
    <title>POMI</title>
    <script>
      ;(() => {
        const stored = localStorage.getItem('pomi-theme')
        const theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.classList.add(theme)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
